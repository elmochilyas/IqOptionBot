name: Safe Offline CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IQOPTION_EMAIL: ""
  IQOPTION_PASSWORD: ""
  IQOPTION_SSID: ""
  OPENAI_API_KEY: ""
  CI: "true"
  PYTHONUNBUFFERED: "1"
  TERM: "dumb"
  NO_COLOR: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  lint-typecheck:
    name: Lint, Format & Typecheck
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install pinned dependencies and dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run Ruff Linter
        run: python -m ruff check src tests
      - name: Check Ruff Formatting
        run: python -m ruff format src tests --check
      - name: Run MyPy Type Checker
        run: python -m mypy src

  security-governance:
    name: Security & Governance Tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install pinned dependencies and dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      - name: Run Application Security Check
        run: python -m iqoption_research.cli.main security-check --json
      - name: Run Security & Governance Suite
        continue-on-error: true
        env:
          PYTEST_EXIT_FILE: ${{ runner.temp }}\pytest_exit_code.txt
        run: python scripts/ci_pytest.py -m "security"
      - name: Verify Pytest Exit Code
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'pytest_exit_code.txt'
          if (-not (Test-Path $path)) { throw "Pytest exit code file is missing: $path" }
          $code = (Get-Content $path -Raw).Trim()
          if ($code -ne '0') { throw "Pytest failed with exit code $code" }

  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install pinned dependencies and dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      - name: Run Unit Suite
        continue-on-error: true
        env:
          PYTEST_EXIT_FILE: ${{ runner.temp }}\pytest_exit_code.txt
        run: python scripts/ci_pytest.py -m "unit and not scientific and not security"
      - name: Verify Pytest Exit Code
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'pytest_exit_code.txt'
          if (-not (Test-Path $path)) { throw "Pytest exit code file is missing: $path" }
          $code = (Get-Content $path -Raw).Trim()
          if ($code -ne '0') { throw "Pytest failed with exit code $code" }

  scientific-tests:
    name: Scientific & Statistical Tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install pinned dependencies and dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      - name: Run Scientific Suite
        continue-on-error: true
        env:
          PYTEST_EXIT_FILE: ${{ runner.temp }}\pytest_exit_code.txt
        run: python scripts/ci_pytest.py -m "scientific"
      - name: Verify Pytest Exit Code
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'pytest_exit_code.txt'
          if (-not (Test-Path $path)) { throw "Pytest exit code file is missing: $path" }
          $code = (Get-Content $path -Raw).Trim()
          if ($code -ne '0') { throw "Pytest failed with exit code $code" }

  integration-tests:
    name: Integration Tests
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install pinned dependencies and dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      - name: Run Integration Suite
        continue-on-error: true
        env:
          PYTEST_EXIT_FILE: ${{ runner.temp }}\pytest_exit_code.txt
        run: python scripts/ci_pytest.py -m "integration"
      - name: Verify Pytest Exit Code
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'pytest_exit_code.txt'
          if (-not (Test-Path $path)) { throw "Pytest exit code file is missing: $path" }
          $code = (Get-Content $path -Raw).Trim()
          if ($code -ne '0') { throw "Pytest failed with exit code $code" }

  desktop-windows:
    name: Windows Desktop Tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install pinned dependencies and dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      - name: Run Desktop UI Suite
        continue-on-error: true
        env:
          PYTEST_EXIT_FILE: ${{ runner.temp }}\pytest_exit_code.txt
        run: python scripts/ci_pytest.py -m "desktop and not performance"
      - name: Verify Pytest Exit Code
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'pytest_exit_code.txt'
          if (-not (Test-Path $path)) { throw "Pytest exit code file is missing: $path" }
          $code = (Get-Content $path -Raw).Trim()
          if ($code -ne '0') { throw "Pytest failed with exit code $code" }

  e2e-tests:
    name: Offline End-to-End Tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install pinned dependencies and dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      - name: Run E2E Suite
        continue-on-error: true
        env:
          PYTEST_EXIT_FILE: ${{ runner.temp }}\pytest_exit_code.txt
        run: python scripts/ci_pytest.py -m "e2e"
      - name: Verify Pytest Exit Code
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'pytest_exit_code.txt'
          if (-not (Test-Path $path)) { throw "Pytest exit code file is missing: $path" }
          $code = (Get-Content $path -Raw).Trim()
          if ($code -ne '0') { throw "Pytest failed with exit code $code" }

  validate:
    name: Lint, Typecheck, Security & Offline Test Suite
    needs:
      - lint-typecheck
      - security-governance
      - unit-tests
      - scientific-tests
      - integration-tests
      - desktop-windows
      - e2e-tests
    if: always()
    runs-on: windows-latest
    steps:
      - name: Enforce all mandatory PR checks passed
        run: |
          $results = @(
            '${{ needs.lint-typecheck.result }}',
            '${{ needs.security-governance.result }}',
            '${{ needs.unit-tests.result }}',
            '${{ needs.scientific-tests.result }}',
            '${{ needs.integration-tests.result }}',
            '${{ needs.desktop-windows.result }}',
            '${{ needs.e2e-tests.result }}'
          )
          Write-Host ("Job results: " + ($results -join ', '))
          if ($results | Where-Object { $_ -ne 'success' }) {
            throw "One or more mandatory PR jobs failed, were cancelled, or skipped."
          }
