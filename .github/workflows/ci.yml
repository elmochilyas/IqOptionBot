name: Safe Offline CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Security & Offline Test Suite
    runs-on: windows-latest
    env:
      IQOPTION_EMAIL: ""
      IQOPTION_PASSWORD: ""
      IQOPTION_SSID: ""
      OPENAI_API_KEY: ""
      CI: "true"
      PYTHONUNBUFFERED: "1"
      TERM: "dumb"
      NO_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned dependencies and dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Verify dependency consistency
        run: |
          python -m pip check

      - name: Run Ruff Linter
        run: |
          python -m ruff check src tests

      - name: Check Ruff Formatting
        run: |
          python -m ruff format src tests --check

      - name: Run MyPy Type Checker
        run: |
          python -m mypy src

      - name: Run Application Security Check
        run: |
          python -m iqoption_research.cli.main security-check --json

      - name: Run Full Offline Pytest Suite
        continue-on-error: true
        env:
          PYTEST_EXIT_FILE: ${{ runner.temp }}\pytest_exit_code.txt
        run: |
          python scripts/ci_pytest.py

      - name: Verify Full Offline Pytest Suite Result
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'pytest_exit_code.txt'
          if (-not (Test-Path $path)) { throw "Pytest exit code file is missing: $path" }
          $code = (Get-Content $path -Raw).Trim()
          Write-Host "PYTEST_EXIT_CODE=$code"
          if ($code -ne '0') { throw "Pytest failed with exit code $code" }
